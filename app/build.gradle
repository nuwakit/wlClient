plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.lgns'
    compileSdk 34

    defaultConfig {
        applicationId "com.lgns"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DISCLAIMER']
        }
        // 注意：这里只管 so 装载到 APK 内是否压缩存放（本项目的 jniLibs 为空）。
        // 它不会消除 APK 内的时间戳，“构建可复现”不靠这一行。
        jniLibs {
            useLegacyPackaging = false
        }
    }
    // 关键配置
    buildFeatures {
        buildConfig = true
    }
    // 1. 必须关闭！否则 AGP 会写入带随机数的加密依赖块，导致每次哈希必变
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    signingConfigs {
        create("release") {
            // 2. 建议关闭 V1 签名，仅使用现代的 V2/V3 确定性签名（minSdk >= 24 均可）
            enableV1Signing = false
            enableV2Signing = true

        }
    }
}
// 3. 抹除所有常规归档任务的动态时间戳并固定文件排序
tasks.withType(AbstractArchiveTask).configureEach {
    isPreserveFileTimestamps = false
    isReproducibleFileOrder = true
}
// 构建一致性：把 javac 版本钉在仓库里，不跟随启动 Gradle 的 IDE 自带 JDK。
// 实测（2026-11-15）：JBR 21 与 JDK 17 各自编出来的 .class 确实不同（内容哈希不一致），
// 只是 D8/R8 会把它们归一化成同一份 dex，本次未签名 APK 才恰好相同；那个“恰好”不能当保证。
// 只换编译器实现，不改 AGP 已传的 -source/-target/-bootclasspath（android.jar 仍作启动类路径）。
// JDK 17 由 Gradle 自动探测常见安装位置发现；探不到时需先装 JDK 17。
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 固定依赖版本(不用+号)
dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // web3j core 4.12.3 (Java 版,官方 pom 完整声明 abi/crypto/tuples/jackson/rxjava 等)
    // Android 侧必须排除:jnr-unixsocket(POSIX UDS,Android 无该 syscall)、AWS KMS(体积大且不需要)
    implementation('org.web3j:core:4.12.3') {
        // 与下面自建 okhttp 4.12.0 对齐,避免版本漂移
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        // Android 不可用:Linux 域 IPC
        exclude group: 'com.github.jnr', module: 'jnr-unixsocket'
        // Android 不需要:AWS KMS 签名后端(体积 MB 级)
        exclude group: 'software.amazon.awssdk', module: 'kms'
        // 若你只用 HTTP RPC,不用 WebSocket 订阅可连这条一起注掉;不确定就别排除
        // exclude group: 'org.java-websocket', module: 'Java-WebSocket'
    }

    // 自建 okhttp(和 web3j HttpService 兼容)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // JDK 核心库脱糖(List.of/Optional/Stream/J Time 等)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'com.google.code.gson:gson:2.10.1'
    def work_version = "2.9.0"
    implementation "androidx.work:work-runtime:$work_version"

    // 兜底显示:强制指定 slf4j 空实现,消除 "SLF4J: No SLF4J providers were found" 噪音
    implementation 'org.slf4j:slf4j-nop:2.0.13'
}